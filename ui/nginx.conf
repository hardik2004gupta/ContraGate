server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ContraGate UI — React SPA served by nginx
    # The PROXY_URL env variable is injected at runtime by Railway
    # for the API reverse proxy. In local docker-compose, vite dev server handles this.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy — proxies /v1/* to the proxy service
    # CONTRAGATE_PROXY_URL must be set at container runtime for production.
    # Default: http://contragate-proxy:8000 (docker-compose name resolution).
    location /v1/ {
        proxy_pass http://contragate-proxy:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /health {
        return 200 '{"status":"ok","service":"contragate-ui"}';
        add_header Content-Type application/json;
    }

    # Gzip
    gzip on;
    gzip_types text/html application/javascript application/json text/css;
}
