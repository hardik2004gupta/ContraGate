[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql_analysis_lib"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psycopg2-binary>=2.9"]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "psycopg2-binary>=2.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
